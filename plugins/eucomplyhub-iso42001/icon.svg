  <line x1="32" y1="22" x2="22" y2="40" stroke="#14B8A6" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="22" x2="42" y2="40" stroke="#14B8A6" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="40" x2="42" y2="40" stroke="#14B8A6" stroke-width="1" opacity="0.5"/>
  <!-- 42001 text -->
  <text x="32" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="8" font-weight="bold">42001</text>
